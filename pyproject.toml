[project]
name = "fireharmony"
version = "0.1.0"
description = "One consistent worldwide fire record from MODIS and VIIRS hotspots, with a burning activity calendar (NASA Space Apps 2026)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=1.26",
  "scipy>=1.13",
  "pyyaml>=6",
  "typer>=0.12",
  "tqdm>=4.66",
  "matplotlib>=3.9",
  "xarray>=2024.6",
  "netCDF4>=1.7",
  "h5py>=3.11",
  "h5netcdf>=1.3",
  "pyhdf>=0.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "mapie>=0.9",
  "shap>=0.46",
  "pymannkendall>=1.4",
  "ruptures>=1.1",
  "pandera>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "papermill>=2.6", "ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10", "nbconvert>=7.16"]

[project.scripts]
fireharmony = "fireharmony.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fireharmony"]

[tool.pytest.ini_options]
testpaths = ["tests"]
