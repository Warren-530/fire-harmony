<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Harmony: one fire record from MODIS and VIIRS</title>
    <meta
      name="description"
      content="Explore one consistent worldwide fire hotspot record from MODIS and VIIRS, 2000 to today, with a burning calendar for any place on Earth."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Link previews (chat apps, social sites): absolute URLs of the published site; the picture is public/og-image.jpg
         (1200 x 630), the burning calendar of Central Kalimantan. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fire Harmony" />
    <meta property="og:title" content="Fire Harmony: one fire record from MODIS and VIIRS" />
    <meta property="og:description" content="One consistent worldwide fire record from MODIS and VIIRS since 2000, with a burning calendar, anomalies and trends for any place on Earth." />
    <meta property="og:url" content="https://warren-530.github.io/fire-harmony/" />
    <meta property="og:image" content="https://warren-530.github.io/fire-harmony/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Burning calendar of Central Kalimantan, 2001 to 2026, next to the title Fire Harmony" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fire Harmony: one fire record from MODIS and VIIRS" />
    <meta name="twitter:description" content="One consistent worldwide fire record from MODIS and VIIRS since 2000, for any place on Earth." />
    <meta name="twitter:image" content="https://warren-530.github.io/fire-harmony/og-image.jpg" />
    <!-- Hexagon and flame in the ember colours of tokens.css (--ember-500, --ember-100). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e75623' d='M16 1.5 28.6 8.75v14.5L16 30.5 3.4 23.25V8.75z'/%3E%3Cpath fill='%23fff3e4' d='M16 7c1.5 3.5 5.5 5.8 5.5 10.6a5.5 5.5 0 0 1-11 0c0-2.4 1.2-4 2.5-5.2.1 1.7.9 2.9 2.1 3.4C14.6 12.8 15 9.8 16 7z'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Before the code arrives: the theme last picked (lib/theme.ts reads the same key) and, on the Explorer, an
         outline of its layout (the header, the area panel at its inset and width, the timeline dock; on a phone the
         bottom sheet), so a first visit never sees a blank white page. React replaces it with App.tsx's own outline. -->
    <script>
      (function () {
        var t = null, d = document.documentElement, h = location.hash;
        try { t = localStorage.getItem('fh_theme'); } catch (e) { /* private mode */ }
        d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');   // light unless the visitor picked dark
        if (!h || h === '#/' || h.indexOf('#/?') === 0) d.setAttribute('data-boot', 'map');
      })();
    </script>
    <style>
      html { background: #f6f6f3; }
      html[data-theme="dark"] { background: #07090d; }
      body { margin: 0; }
      .fh-preboot { position: fixed; inset: 0; --b: rgba(255, 255, 255, 0.08); --s: #0d1118; --s2: #121822; }
      html[data-theme="light"] .fh-preboot { --b: #e3e2db; --s: #ffffff; --s2: #f1f1ed; }
      .fh-preboot-bar { height: 55px; border-bottom: 1px solid var(--b); }
      .fh-preboot-map { display: none; position: absolute; inset: 56px 0 0 0; }
      html[data-boot="map"] .fh-preboot-map { display: block; }
      .fh-preboot-panel { position: absolute; top: 16px; left: 16px; bottom: 16px; width: 384px; box-sizing: border-box; display: grid;
        align-content: start; gap: 12px; padding: 12px 16px; border: 1px solid var(--b); border-radius: 14px; background: var(--s); }
      .fh-preboot-panel i { display: block; height: 44px; border-radius: 9px; background: var(--s2); }
      .fh-preboot-panel i.fh-preboot-tall { height: 190px; }
      .fh-preboot-dock { position: absolute; left: 416px; right: 16px; bottom: 16px; height: 92px; box-sizing: border-box;
        border: 1px solid var(--b); border-radius: 14px; background: var(--s); }
      @media (max-width: 1100px) { .fh-preboot-panel { width: 340px; } .fh-preboot-dock { left: 372px; } }
      @media (max-width: 768px) {
        .fh-preboot-dock { display: none; }
        .fh-preboot-panel { inset: auto 0 0 0; width: auto; height: 50%; padding-top: 20px; border-bottom: 0; border-radius: 14px 14px 0 0; }
      }
      @media (max-width: 880px) and (max-height: 500px) { .fh-preboot-bar { height: 47px; } .fh-preboot-map { top: 48px; } }
    </style>
    <!-- without JavaScript the outline would wait for ever over the note below -->
    <noscript><style>.fh-preboot { display: none; } body { padding: 24px; color: #a9b1bd; font: 16px/1.5 system-ui, sans-serif; }</style></noscript>
  </head>
  <body>
    <noscript>Fire Harmony needs JavaScript to run. Please turn it on and reload the page.</noscript>
    <div id="root"><div class="fh-preboot" aria-hidden="true"><div class="fh-preboot-bar"></div><div class="fh-preboot-map"><div class="fh-preboot-panel"><i></i><i></i><i class="fh-preboot-tall"></i></div><div class="fh-preboot-dock"></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
